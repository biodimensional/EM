- title: "MRI Safety: SAR and Temperature Estimation"
  description: "TESS — serverless tool for patient-specific SAR and temperature estimation in MRI."
  long_description: |
    TESS (Temperature Estimation from SAR Simulation) uses a customized bioheat equation to evaluate MRI examination safety. Version 2.0 runs serverlessly on AWS, providing efficient and accessible safety assessment. Combined with automated image registration to create patient-specific body models.
  tags: [mri, safety, sar, simulation, cloud, aws]
  links:
    - label: "Paper"
      url: "https://ieeexplore.ieee.org/abstract/document/10805647"
  related_publications: [-23, -16]
  related_repos: ["TESS"]
  featured: true
  thumbnail: "/images/default-image.png"

- title: "Deep Learning for Electromagnetic Field Estimation"
  description: "Neural networks trained on analytical solutions to predict RF fields in MRI from B1 maps."
  long_description: |
    Deep learning networks trained on 2D analytical solutions of electromagnetic fields in concentric cylinders. The networks can estimate electric fields from B1+ and SNR maps, even in presence of noise (max NRMSE 13.6%), opening the path to real-time patient-specific safety assessment.
  tags: [mri, deep-learning, simulation, electromagnetic, sar]
  links:
