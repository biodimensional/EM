- title: "CloudMR — Cloud-Native MRI Simulation Platform"
  description: "A modular, open-source cloud platform for MRI research and education."
  long_description: |
    CloudMR democratizes magnetic resonance imaging research by providing a cloud-native simulation platform accessible via the web. Researchers can test new technology and radiologists can optimize clinical protocols without operating an actual MR scanner.
    The platform connects six open-source stand-alone modules to simulate all stages of an MRI experiment — from coil modeling to spin excitation and image reconstruction.
  tags: [mri, simulation, cloud, aws, open-source, webapp]
  links:
