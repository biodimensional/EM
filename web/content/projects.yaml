- title: "Radiomics for FAI Diagnosis"
  description: "Automated MRI-based radiomics pipeline for femoroacetabular impingement diagnosis."
  long_description: |
    A multi-study research project demonstrating that radiomics features automatically extracted from 3D Dixon MRI outperform standard radiological measurements in detecting FAI. The pipeline achieves >97% accuracy with fully automated segmentation and feature extraction.
  tags: [radiomics, mri, fai, machine-learning, deep-learning]
  links:
    - label: "Publication"
      url: "https://pubmed.ncbi.nlm.nih.gov/37492381/"
  related_publications: [-29, -22, -19, -20, -26]
  related_repos: ["pyRadiomics Pipeline for FAI", "Hip Segmentation DL"]
  featured: true
